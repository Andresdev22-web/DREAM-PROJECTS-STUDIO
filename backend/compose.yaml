
name: api-dreamprojectsstudio

services:
  api:
    build: .
    container_name: api_dreamProjectsStudio_app
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?DB_NAME es obligatorio}
      DB_USER: ${DB_USER:?DB_USER es obligatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Falta GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Falta GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?Falta GOOGLE_REDIRECT_URI}

      FRONTEND_URL: ${FRONTEND_URL:?Falta FRONTEND_URL}
      COOKIE_SECURE: "true"
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?Falta OAUTH_STATE_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - web
      - database

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.api-dreamprojectsstudio.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.api-dreamprojectsstudio.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.api-dreamprojectsstudio.tls=true"
      - "traefik.http.routers.api-dreamprojectsstudio.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.api-dreamprojectsstudio.loadbalancer.server.port=8000"

  mysql:
    image: mysql:8.4
    container_name: api_dreamProjectsStudio_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME es obligatorio}
      MYSQL_USER: ${DB_USER:?DB_USER es obligatorio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatorio}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - database

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  web:
    external: true
  database:
    internal: true
