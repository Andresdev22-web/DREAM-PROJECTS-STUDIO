
name: api-dreamProjectsStudio

services:
  api:
    build: .
    container_name: api_dreamProjectsStudio_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - web
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.api-dreamProjectsStudio.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.api-dreamProjectsStudio.entrypoints=${ENTRYPOINT}"
      - "traefik.http.routers.api-dreamProjectsStudio.tls=true"
      - "traefik.http.routers.api-dreamProjectsStudio.tls.certresolver=${CERTRESOLVER}"
      - "traefik.http.services.api-dreamProjectsStudio.loadbalancer.server.port=8000"

  mysql:
    image: mysql:8.4
    container_name: api_dreamProjectsStudio_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:

networks:
  web:
    external: true
  database:
    internal: true
